<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire des schémas précoces (YSQ)</title>
<style>
  :root{
    --bg: #f6f5f1;
    --paper: #ffffff;
    --ink: #262b2e;
    --ink-soft: #5c6469;
    --line: #dfdcd4;
    --accent: #3f5d5b;
    --accent-soft: #e7eeed;
    --warn: #9a5b3f;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.55;
    min-height:100vh;
  }
  .shell{
    max-width:720px;
    margin:0 auto;
    padding:32px 20px 64px;
  }
  h1,h2,h3{
    font-family: Georgia, "Times New Roman", serif;
    font-weight:600;
    letter-spacing:0.2px;
    color:var(--ink);
  }
  .brand{
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 26px;
  }
  .disclaimer{
    background:var(--accent-soft);
    border:1px solid #c9d8d6;
    border-radius:var(--radius);
    padding:16px 18px;
    font-size:14.5px;
    color:#33463f;
    margin:20px 0;
  }
  .btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .btn:hover{background:#345250;}
  .btn.secondary{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
  }
  .btn.secondary:hover{background:var(--accent-soft);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;}

  /* progress */
  .progress-wrap{
    display:flex;align-items:center;gap:12px;margin-bottom:22px;
  }
  .progress-track{
    flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--accent);width:0%;transition:width .25s ease;
  }
  .progress-label{font-size:13px;color:var(--ink-soft);white-space:nowrap;}

  .domain-tag{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--accent);
    margin-bottom:10px;
  }
  .question-text{
    font-size:20px;
    line-height:1.5;
    margin:6px 0 26px;
  }
  .scale{
    display:flex;
    gap:8px;
    justify-content:space-between;
  }
  .scale button{
    flex:1;
    padding:14px 4px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fafaf8;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    transition:all .12s ease;
  }
  .scale button:hover{border-color:var(--accent);background:var(--accent-soft);}
  .scale button.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .scale-labels{
    display:flex;justify-content:space-between;
    font-size:12px;color:var(--ink-soft);margin-top:8px;
  }

  /* results */
  .result-row{margin-bottom:18px;}
  .result-head{
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;
  }
  .result-name{font-size:15px;font-weight:600;}
  .result-score{font-size:14px;color:var(--ink-soft);}
  .bar-track{
    height:10px;background:var(--line);border-radius:6px;overflow:hidden;
  }
  .bar-fill{height:100%;border-radius:6px;background:#9fb3b0;}
  .bar-fill.high{background:var(--warn);}

  .highlight-card{
    background:#fbf3ee;
    border:1px solid #e6cdbe;
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:14px;
  }
  .highlight-card h3{margin:0 0 6px;font-size:17px;color:#7a4429;}
  .highlight-card p{margin:0;font-size:14.5px;color:#4b3a30;}

  footer.note{
    font-size:12.5px;color:var(--ink-soft);margin-top:30px;text-align:center;
  }

  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .shell{max-width:100%;padding:0 12px;}
    .card{border:none;padding:0;}
  }
</style>
</head>

const ITEMS = RAW.map(r => ({id:r[0], domain:r[1], text:r[2]}));
const TOTAL = ITEMS.length;
const SCALE_LABELS = ["Totalement faux","Plutôt faux","Plutôt vrai","Vrai la moitié du temps","Assez vrai","Me décrit parfaitement"];

let state = { screen:"intro", index:0, answers:{} };

const app = document.getElementById("app");

function render(){
  if(state.screen === "intro") return renderIntro();
  if(state.screen === "quiz") return renderQuiz();
  if(state.screen === "results") return renderResults();
}

function renderIntro(){
  app.innerHTML = `
    <div class="brand">Auto-évaluation</div>
    <h1>Questionnaire des schémas précoces (YSQ)</h1>
    <div class="card">
      <p>Ce questionnaire explore 18 grandes tendances psychologiques ("schémas") qui se forment tôt dans la vie
      et influencent la façon dont on se perçoit soi-même et dont on vit ses relations. Il comprend
      ${TOTAL} affirmations. Pour chacune, indique à quel point elle te correspond, sur une échelle de 1 à 6.</p>
      <div class="disclaimer">
        <strong>Ce n'est pas un outil de diagnostic.</strong> Les résultats donnent un aperçu de tendances personnelles,
        pas un diagnostic clinique. Ils sont plus utiles s'ils sont discutés avec un(e) psychologue ou un(e) thérapeute
        formé(e) à la thérapie des schémas, notamment si certains scores sont élevés ou source d'inquiétude.
      </div>
      <p style="font-size:14px;color:var(--ink-soft);">Durée estimée : 20 à 35 minutes. Tu peux revenir en arrière à tout moment pendant la passation.
      Aucune donnée n'est envoyée ou conservée : tout reste dans cette page, dans ton navigateur.</p>
      <div class="btn-row">
        <button class="btn" onclick="startQuiz()">Commencer le questionnaire</button>
      </div>
    </div>
  `;
}

function startQuiz(){
  state.screen = "quiz";
  state.index = 0;
  render();
}

function renderQuiz(){
  const item = ITEMS[state.index];
  const domain = DOMAINS[item.domain];
  const pct = Math.round(((state.index) / TOTAL) * 100);
  const current = state.answers[item.id];

  let scaleHtml = "";
  for(let v=1; v<=6; v++){
    scaleHtml += `<button class="${current===v ? 'selected':''}" onclick="answer(${item.id}, ${v})">${v}</button>`;
  }

  app.innerHTML = `
    <div class="progress-wrap no-print">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${state.index+1} / ${TOTAL}</div>
    </div>
    <div class="card">
      <div class="domain-tag">${domain.name}</div>
      <div class="question-text">${item.text}</div>
      <div class="scale">${scaleHtml}</div>
      <div class="scale-labels"><span>1 · ${SCALE_LABELS[0]}</span><span>6 · ${SCALE_LABELS[5]}</span></div>
      <div class="btn-row">
        <button class="btn secondary" onclick="prevItem()" ${state.index===0 ? "disabled":""}>← Précédent</button>
        ${state.index === TOTAL-1 ? `<button class="btn" onclick="showResults()" ${current===undefined?"disabled":""}>Voir mes résultats</button>` : ""}
      </div>
    </div>
  `;
}

function answer(id, value){
  state.answers[id] = value;
  if(state.index < TOTAL - 1){
    setTimeout(()=>{
      state.index++;
      render();
    }, 150);
  } else {
    render(); // just refresh to enable the results button
  }
}

function prevItem(){
  if(state.index > 0){
    state.index--;
    render();
  }
}

function showResults(){
  state.screen = "results";
  render();
}

function computeScores(){
  const sums = new Array(DOMAINS.length).fill(0);
  const counts = new Array(DOMAINS.length).fill(0);
  ITEMS.forEach(item=>{
    const v = state.answers[item.id];
    if(v !== undefined){
      sums[item.domain] += v;
      counts[item.domain] += 1;
    }
  });
  return DOMAINS.map((d,i)=>({
    name:d.name,
    desc:d.desc,
    avg: counts[i] ? sums[i]/counts[i] : 0
  }));
}

function renderResults(){
  const scores = computeScores().sort((a,b)=> b.avg - a.avg);
  const elevated = scores.filter(s => s.avg >= 4);
  const top = elevated.slice(0,3);

  let barsHtml = scores.map(s=>{
    const pct = (s.avg/6)*100;
    const highClass = s.avg >= 4 ? "high" : "";
    return `
      <div class="result-row">
        <div class="result-head">
          <span class="result-name">${s.name}</span>
          <span class="result-score">${s.avg.toFixed(2)} / 6</span>
        </div>
        <div class="bar-track"><div class="bar-fill ${highClass}" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join("");

  let topHtml = "";
  if(top.length){
    topHtml = `<h2>Schémas les plus marqués</h2>` + top.map(s=>`
      <div class="highlight-card">
        <h3>${s.name} — ${s.avg.toFixed(2)}/6</h3>
        <p>${s.desc}</p>
      </div>
    `).join("");
  } else {
    topHtml = `<div class="disclaimer">Aucun domaine ne ressort avec un score moyen ≥ 4/6 : l'ensemble de tes réponses reste modéré sur les 18 dimensions.</div>`;
  }

  app.innerHTML = `
    <div class="brand no-print">Résultats</div>
    <h1>Ton profil de schémas</h1>
    <div class="card">
      <p style="font-size:14px;color:var(--ink-soft);">Seuil retenu : un score moyen ≥ 4/6 signale un domaine "marqué". Ceci reste une auto-évaluation
      à visée réflexive, pas un diagnostic.</p>
      ${topHtml}
      <h2 style="margin-top:28px;">Détail des 18 domaines</h2>
      ${barsHtml}
      <div class="btn-row no-print">
        <button class="btn secondary" onclick="restart()">Refaire le test</button>
        <button class="btn" onclick="window.print()">Imprimer / Exporter en PDF</button>
      </div>
    </div>
    <footer class="note no-print">Si certains résultats te préoccupent ou soulèvent des questions, en parler avec un(e) professionnel(le) de santé mentale peut être utile.</footer>
  `;
}

function restart(){
  state = { screen:"intro", index:0, answers:{} };
  render();
}

render();
</script>
